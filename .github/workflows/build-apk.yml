name: Ofis Adim APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak Kodlari Al
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 8.7 Kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: OfisAdim.apk Derle
        run: gradle assembleDebug

      - name: APK Dosyasini Indirilebilir Olarak Yukle
        uses: actions/upload-artifact@v4
        with:
          name: OfisAdim-APK
          path: app/build/outputs/apk/debug/app-debug.apk
